services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openingos
      POSTGRES_PASSWORD: openingos
      POSTGRES_DB: openingos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
  api:
    image: node:20
    working_dir: /app/server
    command: sh -lc "npm install && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 8787
      DATABASE_URL: postgres://openingos:openingos@db:5432/openingos
      JWT_SECRET: dev-secret-change-me
      APP_URL: http://localhost:4173
      API_URL: http://localhost:8787
      CORS_ORIGIN: http://localhost:4173
      ADMIN_EMAILS: dev@example.com
    volumes:
      - .:/app
    ports:
      - "8787:8787"
    depends_on:
      - db
volumes:
  pgdata:
