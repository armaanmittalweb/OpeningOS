name: monkfish-app
region: blr

services:
  - name: openingos
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 8787
    source_dir: server

    github:
      repo: armaanmittalweb/OpeningOS
      branch: main
      deploy_on_push: false

    build_command: npm install && npm run build
    run_command: npm run start

    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL

      - key: PORT
        value: "8787"
        scope: RUN_TIME
        type: GENERAL

      - key: DATABASE_URL
        value: ${DATABASE_URL}
        scope: RUN_TIME
        type: SECRET

      - key: JWT_SECRET
        value: ${JWT_SECRET}
        scope: RUN_TIME
        type: SECRET

      - key: FRONTEND_URL
        value: https://armaanmittalweb.github.io/OpeningOS
        scope: RUN_TIME
        type: GENERAL

      - key: CORS_ORIGIN
        value: https://armaanmittalweb.github.io
        scope: RUN_TIME
        type: GENERAL

      - key: ADMIN_EMAILS
        value: ${ADMIN_EMAILS}
        scope: RUN_TIME
        type: SECRET

      - key: RATE_LIMIT_MAX
        value: "240"
        scope: RUN_TIME
        type: GENERAL

      - key: RATE_LIMIT_WINDOW
        value: "1 minute"
        scope: RUN_TIME
        type: GENERAL