<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* wss: https://lichess.org https://api.chess.com https://explorer.lichess.ovh https://cloud.appwrite.io https://*.cloud.appwrite.io https://api.stripe.com https://checkout.stripe.com https://*.ondigitalocean.app https://monkfish-app-yxidj.ondigitalocean.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" />
  <title>OpeningOS — your chess opening operating system</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2391b89f'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' font-family='serif' fill='%230d1410'%3E%E2%99%9E%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#0d1216" />
  <meta name="description" content="OpeningOS is a cloud-sync chess opening preparation workspace for repertoires, practice, game repair, coach tracking, and serious opening study." />
  <meta name="openingos-api-url" content="https://monkfish-app-yxidj.ondigitalocean.app" />
  <meta property="og:title" content="OpeningOS — chess opening preparation" />
  <meta property="og:description" content="Build, practice, repair, and sync your chess opening repertoire." />
  <meta property="og:type" content="website" />
</head>
<body data-view="today" data-tournament="false">
  <!-- Top navigation -->
  <header class="topnav">
    <div class="topnav-left">
      <a class="brand" href="#today" data-nav="today" aria-label="OpeningOS home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M5 21h14v-2H5v2zm2.5-4h9l1.5-9-3.5 2L12 5l-2.5 5L6 8l1.5 9z"/></svg>
        </span>
        <span class="brand-text">OpeningOS</span>
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="#today" data-nav="today">Today</a>
        <a href="#repertoire" data-nav="repertoire">Repertoire</a>
        <a href="#practice" data-nav="practice">Practice</a>
        <a href="#games" data-nav="games">Games</a>
        <a href="#library" data-nav="library">Library</a>
        <a href="#insights" data-nav="insights">Insights</a>
        <a href="#coach" data-nav="coach">Coach</a>
        <a href="#opponent" data-nav="opponent">Opponent</a>
      </nav>
    </div>
    <div class="topnav-right">
      <button class="cmd-trigger" id="cmdTrigger" aria-label="Open command palette">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M21 11.5l-6.5-6.5L13 6.5 17.5 11H3v2h14.5L13 17.5l1.5 1.5L21 12.5z"/></svg>
        <span>Search or jump to</span>
        <kbd>⌘K</kbd>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle light/dark theme">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18 9 9 0 0 0 8.5-6 7 7 0 0 1-8.5-9.6A8.94 8.94 0 0 0 12 3z"/></svg>
      </button>
      <button class="icon-btn" id="tournamentBtn" title="Tournament mode" aria-pressed="false" aria-label="Tournament mode">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 4h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 16v3h3v2H8v-2h3v-3a5 5 0 0 1-2.7-3H8a4 4 0 0 1-4-4V6h3V4zm0 4H6v1a2 2 0 0 0 1 1.7V8zm10 0v2.7A2 2 0 0 0 18 9V8h-1z"/></svg>
      </button>
      <a class="icon-btn" href="#settings" data-nav="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 5l-1.6-.6a7 7 0 0 0-.4-1.5l1-1.4-1.4-1.4-1.4 1a7 7 0 0 0-1.5-.4L15 7h-2l-.6 1.6a7 7 0 0 0-1.5.4l-1.4-1-1.4 1.4 1 1.4a7 7 0 0 0-.4 1.5L7 13v2l1.6.6a7 7 0 0 0 .4 1.5l-1 1.4 1.4 1.4 1.4-1a7 7 0 0 0 1.5.4L13 21h2l.6-1.6a7 7 0 0 0 1.5-.4l1.4 1 1.4-1.4-1-1.4a7 7 0 0 0 .4-1.5L21 15v-2z"/></svg>
      </a>
      <button class="profile-trigger" id="profileBtn" aria-haspopup="menu" aria-expanded="false" title="Profile menu">
        <span class="avatar" id="profileAvatar">·</span>
      </button>
    </div>
  </header>

  <!-- Profile menu (positioned by JS under #profileBtn) -->
  <div class="profile-menu" id="profileMenu" hidden>
    <div class="profile-menu-back" data-profile-close></div>
    <div class="profile-menu-panel" role="menu" aria-label="Profile menu" id="profileMenuPanel"></div>
  </div>



  <!-- Mobile primary navigation -->
  <nav class="mobile-tabbar" aria-label="Mobile primary navigation">
    <a class="mobile-tab" href="#today" data-nav="today" aria-label="Today">
      <span aria-hidden="true">⌂</span><small>Today</small>
    </a>
    <a class="mobile-tab" href="#repertoire" data-nav="repertoire" aria-label="Repertoire">
      <span aria-hidden="true">♟</span><small>Prep</small>
    </a>
    <a class="mobile-tab mobile-tab-primary" href="#practice" data-nav="practice" aria-label="Practice">
      <span aria-hidden="true">▶</span><small>Practice</small>
    </a>
    <a class="mobile-tab" href="#games" data-nav="games" aria-label="Games">
      <span aria-hidden="true">▤</span><small>Games</small>
    </a>
    <button class="mobile-tab" type="button" id="mobileMoreBtn" aria-label="More actions">
      <span aria-hidden="true">⋯</span><small>More</small>
    </button>
  </nav>

  <!-- Mobile FAB -->
  <button class="fab" id="fabBtn" aria-label="Quick actions" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>
  <div class="bottom-sheet" id="bottomSheet" hidden>
    <div class="bottom-sheet-back" data-sheet-close></div>
    <div class="bottom-sheet-panel" id="bottomSheetPanel"></div>
  </div>

  <!-- Main content -->
  <main id="app">
    <!-- Views are mounted here by JS -->
  </main>

  <!-- Command palette -->
  <div class="cmd-palette" id="cmdPalette" hidden>
    <div class="cmd-backdrop" data-cmd-close></div>
    <div class="cmd-panel" role="dialog" aria-label="Command palette">
      <div class="cmd-input-row">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 2a8 8 0 1 1-5.3 14L2 18.7 3.3 20l2.7-2.7A8 8 0 0 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
        <input id="cmdInput" type="text" placeholder="Jump to opening, start practice, import PGN…" autocomplete="off" spellcheck="false" />
        <kbd>esc</kbd>
      </div>
      <ul class="cmd-list" id="cmdList"></ul>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <!-- Onboarding overlay (multi-step wizard built by JS) -->
  <div class="onboard" id="onboard" hidden>
    <div class="onboard-card" id="onboardCard"></div>
  </div>

  <!-- Chess.js (UMD/global) for legal-move logic. Bundled locally so the
       app works fully offline once the service worker has cached assets. -->
  <script src="vendor/chess.min.js"></script>
  <script src="js/env.js"></script>
  <!-- App scripts -->
  <script src="js/profile.js"></script>
  <script src="js/pgn.js"></script>
  <script src="js/api.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/idb_store.js"></script>
  <script src="js/fsrs.js"></script>
  <script src="js/analysis_engine.js"></script>
  <script src="js/engine_integration.js"></script>
  <script src="js/engine_connector.js"></script>
  <script src="js/data.js"></script>
  <script src="js/graph_native.js"></script>
  <script src="js/native_graph.js"></script>
  <script src="js/advanced_review.js"></script>
  <script src="js/game_review_pro.js"></script>
  <script src="js/board.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/views.js"></script>
  <script src="js/product.js"></script>
  <script src="js/product_plus.js"></script>
  <script src="js/cloud_sync.js"></script>
  <script src="js/deployment_config.js"></script>
  <script src="js/saas_client.js"></script>
  <script src="js/enterprise_api.js"></script>
  <script src="js/stockfish_client.js"></script>
  <script src="js/engine_client.js"></script>
  <script src="js/backend_saas.js"></script>
  <script src="js/sync_engine.js"></script>
  <script src="js/product_release.js"></script>
  <script src="js/pro_content.js"></script>
  <script src="js/production_ready.js"></script>
  <script src="js/launch.js"></script>
  <script src="js/ui_polish.js"></script>
  <script src="js/saas_ui.js"></script>
  <script src="js/account_gateway.js"></script>
  <script src="js/settings_enforcement.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/accessibility_complete.js"></script>
  <script src="js/observability.js"></script>
  <script src="js/product_auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
