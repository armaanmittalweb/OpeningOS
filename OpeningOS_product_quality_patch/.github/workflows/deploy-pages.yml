name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "404.html"
      - "manifest.json"
      - "sw.js"
      - "styles.css"
      - "js/**"
      - "src/**"
      - "icons/**"
      - "vendor/**"
      - "public/**"
      - "tools/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openingos-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:deploy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy frontend
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
